name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Storybook phones home by default.
  STORYBOOK_DISABLE_TELEMETRY: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Types, theme and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      # The games' own gate (DECISIONS.md ADR-019): Vitest in node. Their
      # Playwright specs need WebKit and a dev server, and run locally.
      - name: Unit tests
        run: npm test

      # The pairings the design relies on, checked against WCAG 2.2 straight
      # from styles/tokens.css. The committed report must be current.
      - name: Contrast gate
        run: npm run check:contrast && git diff --exit-code docs/design-system/contrast-report.md

      - name: Next build (strict)
        run: npm run build

  # Color Tap's photos (DECISIONS.md ADR-022). A build only warns about a photo it can't convert and
  # leaves it out, so one bad file never stops the site deploying; this is where it is stopped. It
  # fails on a damaged photo, two photos whose names come out the same, or a photo whose puzzles
  # weren't made and committed. Listed as a required check in the main branch's ruleset, a pull
  # request that fails it can't merge.
  color-tap:
    name: Color Tap photos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Every photo converts, and its puzzles are committed
        run: npm run color-tap:puzzles -- --check

  storybook:
    name: Storybook — a11y and interactions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Every story in its one colour scheme (DECISIONS.md ADR-026), with axe
      # violations failing the run rather than reporting, and the page's own
      # play tests (Pages/Home). Together with the contrast gate above, this is
      # what catches an accessibility fault in a component (ADR-023).
      - name: Story tests
        run: npm run test:storybook

      - name: Build Storybook
        run: npm run build-storybook

      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7

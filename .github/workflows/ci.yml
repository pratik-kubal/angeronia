name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Storybook phones home by default.
  STORYBOOK_DISABLE_TELEMETRY: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Types, theme and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      # Compiles the production stylesheet, checks that every token the brand
      # override assigns is one Carbon defines, and asserts WCAG AA across every
      # pairing the override creates in both themes — plus the favicon against
      # the teal ramp and the committed theme report.
      - name: Theme gate
        run: npm run check:theme

      - name: Next build (strict)
        run: npm run build

  storybook:
    name: Storybook — a11y and interactions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Every story, in both themes, with axe violations failing the run rather
      # than reporting. This is the gate that replaced `slds-linter` — see
      # DECISIONS.md ADR-018.
      - name: Story tests
        run: npm run test:storybook

      - name: Build Storybook
        run: npm run build-storybook

      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7

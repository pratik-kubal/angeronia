<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- The spine in miniature (ADR-026, ADR-031): the hero's two lines as bars on paper, one hanging
       from the line at 38% of the width, one crossing it, and the line broken where it is crossed.
       Drawn on a 2-unit grid so every edge lands on a whole pixel at 16 x 16.
       The fill colours are the palette's paper and ink tokens in styles/tokens.css. -->
  <rect width="32" height="32" fill="#f1f1ef"/>
  <g fill="#1c1c1c">
    <rect x="10" y="0" width="4" height="16"/>
    <rect x="16" y="8" width="12" height="6"/>
    <rect x="4" y="18" width="20" height="6"/>
    <rect x="10" y="26" width="4" height="6"/>
  </g>
</svg>
